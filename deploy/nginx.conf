# Top Joint — Production Nginx virtual host for VPS reverse proxy -> Docker app (127.0.0.1:3000)
#
# Deployment setup on Ubuntu/Debian VPS:
#   1. Ensure DNS for topjoint.shop and www.topjoint.shop points to this VPS.
#   2. Copy this file to /etc/nginx/sites-available/topjoint and symlink to /etc/nginx/sites-enabled/topjoint.
#   3. Issue TLS certs with Certbot:
#        sudo certbot --nginx -d topjoint.shop -d www.topjoint.shop
#      (Or obtain cert first with `certbot certonly --webroot -w /var/www/certbot -d topjoint.shop -d www.topjoint.shop`
#       and uncomment the SSL server block below.)
#   4. Test and reload Nginx: `sudo nginx -t && sudo systemctl reload nginx`.
#   5. Schedule regular backups of BOTH PostgreSQL (`pg_dump`) and the `topjoint_storage` Docker volume.
#   6. Once Meta Ads is configured in /admin/reglages, clear `metaTestEventCode` before running live campaigns.

server {
    listen 80;
    listen [::]:80;
    server_name topjoint.shop www.topjoint.shop;

    # ACME challenge for Let's Encrypt / Certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name topjoint.shop www.topjoint.shop;

    # Paths managed by Certbot (adjust if using a different certificate location)
    ssl_certificate /etc/letsencrypt/live/topjoint.shop/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/topjoint.shop/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    server_tokens off;

    # Allow 10 MB uploads + multipart overhead (matches next.config.ts bodySizeLimit: 12mb)
    client_max_body_size 12m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite (do not append) X-Forwarded-For so clients cannot spoof rate-limit IPs
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
