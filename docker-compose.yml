# Local PostgreSQL for development: `npm run db:up`.
# Port 5434 avoids clashing with a PostgreSQL already installed on 5432/5433.
services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: topjoint
      POSTGRES_PASSWORD: topjoint
      POSTGRES_DB: topjoint
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U topjoint -d topjoint"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
